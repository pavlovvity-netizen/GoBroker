syntax = "proto3";

package marketdata;

option go_package = "GoBroker/proto";

// Запрос на подписку (список тикеров)
message SubscribeRequest {
  repeated string symbols = 1;
}

// Структура тика котировки
message Quote {
  string symbol = 1;
  double price = 2;
  int64 timestamp = 3;
  string source = 4;
}

// Сервис для получения потока котировок
service MarketDataService {
  rpc SubscribeQuotes (SubscribeRequest) returns (stream Quote);
}