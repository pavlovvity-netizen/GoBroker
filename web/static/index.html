<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBroker — Go Style Quotes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            padding: 24px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #1e293b;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
            color: #00ADD8; /* Go Cyan */
            letter-spacing: -0.5px;
        }

        .gopher-icon {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        /* Трёхколоночная верстка */
        .columns-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 900px) {
            .columns-container {
                grid-template-columns: 1fr;
            }
        }

        .column {
            background-color: #131d31;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .column-header {
            font-size: 16px;
            font-weight: 700;
            padding-bottom: 10px;
            border-bottom: 2px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: border-color 0.2s ease, transform 0.15s ease;
        }

        .card:hover {
            border-color: #00ADD8;
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .symbol {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        /* Плашки источников */
        .source-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .source-binance { background-color: rgba(240, 185, 11, 0.15); color: #f0b90b; border: 1px solid rgba(240, 185, 11, 0.4); }
        .source-moex { background-color: rgba(218, 41, 28, 0.15); color: #ff6b6b; border: 1px solid rgba(218, 41, 28, 0.4); }
        .source-cbr, .source-сбр, .source-cbrf, .source-цб, .source-цбр { 
            background-color: rgba(0, 173, 216, 0.15); 
            color: #00ADD8; 
            border: 1px solid rgba(0, 173, 216, 0.4); 
        }

        .price {
            font-size: 26px;
            font-weight: 700;
            color: #38bdf8;
            font-variant-numeric: tabular-nums;
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #334155;
            padding-top: 8px;
        }

        .time-label {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .time-label::before {
            content: '•';
            color: #00ADD8;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <!-- Векторный Go Gopher -->
            <svg class="gopher-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path fill="#00ADD8" d="M50 10C30 10 20 25 20 45v25c0 15 10 20 30 20s30-5 30-20V45c0-20-10-35-30-35z"/>
                <circle cx="38" cy="35" r="9" fill="#FFFFFF"/>
                <circle cx="62" cy="35" r="9" fill="#FFFFFF"/>
                <circle cx="40" cy="35" r="4" fill="#000000"/>
                <circle cx="60" cy="35" r="4" fill="#000000"/>
                <circle cx="22" cy="22" r="7" fill="#00ADD8"/>
                <circle cx="22" cy="22" r="4" fill="#F0D8B8"/>
                <circle cx="78" cy="22" r="7" fill="#00ADD8"/>
                <circle cx="78" cy="22" r="4" fill="#F0D8B8"/>
                <ellipse cx="50" cy="46" rx="8" ry="6" fill="#F0D8B8"/>
                <ellipse cx="50" cy="43" rx="4" ry="2.5" fill="#000000"/>
                <rect x="47" y="50" width="3" height="4" fill="#FFFFFF" rx="1"/>
                <rect x="50.5" y="50" width="3" height="4" fill="#FFFFFF" rx="1"/>
            </svg>
            <span>GoBroker</span>
        </div>
    </header>

    <!-- Трёхколоночная структура -->
    <div class="columns-container">
        <!-- Колонка 1: Binance -->
        <div class="column">
            <div class="column-header">
                <span>Binance</span>
                <span class="source-tag source-binance">Crypto</span>
            </div>
            <div class="cards-list" id="col-binance"></div>
        </div>

        <!-- Колонка 2: MOEX -->
        <div class="column">
            <div class="column-header">
                <span>MOEX</span>
                <span class="source-tag source-moex">Stocks</span>
            </div>
            <div class="cards-list" id="col-moex"></div>
        </div>

        <!-- Колонка 3: CBR (ЦБ) -->
        <div class="column">
            <div class="column-header">
                <span>CBR (Центробанк)</span>
                <span class="source-tag source-cbr">Currencies</span>
            </div>
            <div class="cards-list" id="col-cbr"></div>
        </div>
    </div>

    <script>
        const cards = {};

        const colBinance = document.getElementById('col-binance');
        const colMoex = document.getElementById('col-moex');
        const colCbr = document.getElementById('col-cbr');

        const socket = new WebSocket('ws://' + window.location.host + '/ws');

        socket.onopen = () => {
            socket.send(JSON.stringify({
                action: "subscribe",
                symbols: [
                    "DOGE/USDT", "TON/USDT", "BTC/USDT", "ETH/USDT", "SBER/RUB", "GAZP/RUB", "VTBR/RUB", "LKOH/RUB", "USD/RUB", "EUR/RUB", "CNY/RUB", "KZT/RUB",
                ]
            }));
        };

        // Функция определения целевой колонки по источнику
        function getTargetColumn(sourceStr) {
            const src = (sourceStr || '').toLowerCase().trim();
            if (src.includes('binance')) return colBinance;
            if (src.includes('moex')) return colMoex;
            if (src.includes('cbr') || src.includes('сбр') || src.includes('цб')) return colCbr;
            
            // Если источник не определен — помещаем по умолчанию в третью или по очереди
            return colCbr;
        }

        socket.onmessage = (event) => {
            try {
                const quote = JSON.parse(event.data);

                const symbol = quote.symbol || quote.Symbol;
                const price = quote.price || quote.Price;
                const source = quote.source || quote.Source || 'Unknown';
                const rawTimestamp = quote.timestamp || quote.Timestamp;

                if (!symbol || price === undefined) return;

                let formattedTime = '--:--:--';
                if (rawTimestamp) {
                    const date = new Date(rawTimestamp > 1e11 ? rawTimestamp : rawTimestamp * 1000);
                    formattedTime = date.toLocaleTimeString('ru-RU');
                } else {
                    formattedTime = new Date().toLocaleTimeString('ru-RU');
                }

                if (!cards[symbol]) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const sourceClass = 'source-' + source.toLowerCase().trim();
                    const targetCol = getTargetColumn(source);

                    card.innerHTML = `
                        <div class="card-header">
                            <span class="symbol">${symbol}</span>
                            <span class="source-tag ${sourceClass}">${source}</span>
                        </div>
                        <div class="price" id="price-${symbol}">-</div>
                        <div class="card-footer">
                            <span class="time-label" id="time-${symbol}">${formattedTime}</span>
                        </div>
                    `;
                    targetCol.appendChild(card);

                    cards[symbol] = {
                        priceEl: card.querySelector(`#price-${CSS.escape(symbol)}`),
                        timeEl: card.querySelector(`#time-${CSS.escape(symbol)}`)
                    };
                }

                const numPrice = Number(price);
                cards[symbol].priceEl.textContent = isNaN(numPrice) ? price : numPrice.toLocaleString('en-US', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 4
                });
                
                cards[symbol].timeEl.textContent = formattedTime;

            } catch (err) {
                console.error("Ошибка парсинга WebSocket сообщения:", err);
            }
        };
    </script>
</body>
</html>
